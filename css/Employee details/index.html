
<!DOCTYPE html>
<html>
<head>
    <title>Employee Details</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            background-image: url("background1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color:red;
        }

        .container {
            background-color: white;
            max-width: 900px;
            margin: auto;
            padding: 20px; 
            border-radius: 10px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid gray;
        }

        th {
            background-color: blue;
            color: white;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }

        tr:hover {
            background-color: lightyellow;
        }

        @media screen and (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
            }

            h1 {
                font-size: 22px;
            }

            th, td {
                padding: 8px;
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <h1>Employee Details</h1>

    <div class="container">

        <div class="table-container">

            <table>

                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Salary</th>
                </tr>

                <tr>

                </tr>

                <tr>
                    <td>102</td>
                    <td>Meera</td>
                    <td>HR</td>
                    <td>HR Executive</td>
                    <td>30000</td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>Rahul</td>
                    <td>Finance</td>
                    <td>Accountant</td>
                    <td>28000</td>
                </tr>

                <tr>
                    <td>104</td>

                </tr>

                <tr>
                    <td>105</td>

            </table>

        </div>

    </div>

</body>
</html>
