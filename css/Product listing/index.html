
<!DOCTYPE html>
<html>
<head>
    <title>Smart Shopping Store</title>

    <style>
        body {
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial;
            margin: 0;
        }

        h1 {
            text-align: center;
            background-color: black;
            color: white;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background-color: white;
            width: 200px;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
        }

        .product img {
            width: 150px;
            height: 150px;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <h1>Smart Shopping Store</h1>

    <div class="container">

        <div class="product">
            <img src="handbag.webp">
            <h3>Handbag</h3>
            <p>Price: ₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="sneaker.webp">
            <h3>Sneakers</h3>
            <p>Price: ₹1499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="smartwatch.jpg">
            <h3>Smart Watch</h3>
            <p>Price: ₹1999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="headphone.jpg">
            <h3>Headphones</h3>
            <p>Price: ₹1299</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="sunglass.webp">
            <h3>Sunglasses</h3>
            <p>Price: ₹599</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="perfume.jpg">
            <h3>Perfume</h3>
            <p>Price: ₹799</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
